<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Gedyes of Seattle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>G</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; position: fixed; top: 0; left: 0; touch-action: none; cursor: pointer; }

    #info-panel {
      position: fixed;
      background: rgba(10,10,10,0.80);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #fff;
      pointer-events: auto;
      cursor: pointer;
      z-index: 10;
      visibility: hidden;
      transition: transform 0.5s cubic-bezier(0.645,0.045,0.355,1);
    }
    #info-panel h2   { font: normal 1.2rem/1.3 Georgia, serif; margin-bottom: 0.5em; }
    #info-panel p    { font: 0.875rem/1.55 system-ui, sans-serif; color: #bbb; margin: 0; }
    #info-panel p a  { color: #9cf; text-underline-offset: 3px; }

    /* Landscape: side panels */
    #info-panel.left  { top:0; left:0;  width:min(280px,26vw); height:100%; padding:2rem 1.5rem; display:flex; flex-direction:column; justify-content:center; visibility:visible; transform:translateX(-100%); }
    #info-panel.right { top:0; right:0; width:min(280px,26vw); height:100%; padding:2rem 1.5rem; display:flex; flex-direction:column; justify-content:center; visibility:visible; transform:translateX(100%);  }
    /* Portrait: top/bottom bars */
    #info-panel.top    { top:0;    left:0; right:0; width:100%; padding:1.25rem 1.5rem; visibility:visible; transform:translateY(-100%); }
    #info-panel.bottom { bottom:0; left:0; right:0; width:100%; padding:1.25rem 1.5rem; visibility:visible; transform:translateY(100%);  }

    #info-panel.shown { transform:translate(0,0); }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info-panel"><h2></h2><p></p></div>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const TENSION         = 8;
const MARGIN          = 10;
const P               = 16;     // skeleton points per blob (4 per rectangle side)
const COVERAGE        = 0.4;
const REVEAL_INTERVAL = 500;    // ms between successive blob fade-ins
const FADE_DURATION   = 1000;   // ms for each blob's fade-in
const TEXTURE_SCALE   = 3.2;    // texture draw diameter as a multiple of baseR
const R_NOISE_AMP     = 0.55;   // radial wiggle amplitude
const A_NOISE_AMP     = 0.12;   // angular wiggle amplitude
const TURN_NOISE_AMP  = 0.45;   // heading drift amplitude
const MORPH_DURATION  = 1.5;    // seconds to morph open/closed
const MORPH_INSET     = 0.97;   // rectangle inset factor — keeps clip just inside image edges
const MORPH_CORNER    = 0.88;   // fraction along each side where corner curve begins
const MORPH_MID       = 0.35;   // fraction along each side for mid-edge points

let projects = [];
let N = 0;
let IMG_SIZE_SUM_SQ = 0;

let W, H;

function computeBaseR(imgSize) {
  return Math.sqrt(COVERAGE * W * H / (Math.PI * IMG_SIZE_SUM_SQ)) * imgSize;
}

// Place a within bounds, avoiding overlap with others (5× at 2r, then 5× at 1r)
function placeBlob(a, others) {
  const pad = a.baseR;
  let ok = false;
  for (let attempt = 0; attempt < 5 && !ok; attempt++) {
    a.x = pad + Math.random() * (W - 2 * pad);
    a.y = pad + Math.random() * (H - 2 * pad);
    ok = !others.some(b => Math.hypot(a.x - b.x, a.y - b.y) < a.baseR * 2);
  }
  for (let attempt = 0; attempt < 5 && !ok; attempt++) {
    a.x = pad + Math.random() * (W - 2 * pad);
    a.y = pad + Math.random() * (H - 2 * pad);
    ok = !others.some(b => Math.hypot(a.x - b.x, a.y - b.y) < a.baseR);
  }
}

function sineNoise(phases, t) {
  let v = 0;
  for (const [freq, amp, phase] of phases) v += Math.sin(t * freq + phase) * amp;
  return v;
}

function morphEase(t) {
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
}

function makePhases(n, targetAmp) {
  const raw = Array.from({ length: n }, () => ({
    freq:  0.3 + Math.random() * 1.4,
    amp:   0.4 + Math.random() * 0.6,
    phase: Math.random() * Math.PI * 2,
  }));
  const total = raw.reduce((s, p) => s + p.amp, 0);
  return raw.map(p => [p.freq, p.amp / total * targetAmp, p.phase]);
}

class Amoeba {
  constructor(index) {
    this.index  = index;
    this.baseR  = computeBaseR(projects[index].imgSize);
    this.frozen = false;
    this.ready  = false;
    this.fadeStart = 0;

    const oc = document.createElement('canvas');
    this.texture = oc; // sized per-image in onload

    const pad = this.baseR;
    this.x = pad + Math.random() * (W - 2 * pad);
    this.y = pad + Math.random() * (H - 2 * pad);

    this._baseSpeed = Math.max(W, H) / (120 + Math.random() * 80);
    this.speed = this._baseSpeed;
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;

    this.age = Math.random() * 200;
    this.imgAspect = 1;
    this.imgW = 0;
    this.imgH = 0;
    this.morphState = 'idle'; // 'idle' | 'opening' | 'open' | 'closing'
    this.morphT     = 0;

    this.rPhases    = Array.from({ length: P }, () => makePhases(4, R_NOISE_AMP));
    this.aPhases    = Array.from({ length: P }, () => makePhases(2, A_NOISE_AMP));
    this.turnPhases = makePhases(3, TURN_NOISE_AMP);

    this._pts = Array.from({ length: P }, () => [0, 0]);
  }

  update(dt) {
    this.age += dt; // wiggle continues even when frozen

    if (this.morphState === 'opening') {
      this.morphT = Math.min(1, this.morphT + dt / MORPH_DURATION);
      if (this.morphT >= 1) this.morphState = 'open';
      const e = morphEase(this.morphT);
      this.x = this.morphStartX + (this.morphTargetX - this.morphStartX) * e;
      this.y = this.morphStartY + (this.morphTargetY - this.morphStartY) * e;
    } else if (this.morphState === 'closing') {
      this.morphT = Math.max(0, this.morphT - dt / MORPH_DURATION);
      if (this.morphT <= 0) {
        this.morphState = 'idle';
        this.frozen = false;
        this.speed = this._baseSpeed;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * this._baseSpeed;
        this.vy = Math.sin(angle) * this._baseSpeed;
      }
    }

    if (this.frozen) return;

    if (this.speed > this._baseSpeed) {
      this.speed += (this._baseSpeed - this.speed) * Math.min(1, 1.5 * dt);
    }

    const heading = Math.atan2(this.vy, this.vx) + sineNoise(this.turnPhases, this.age * 0.08) * dt;
    this.vx = Math.cos(heading) * this.speed;
    this.vy = Math.sin(heading) * this.speed;

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    const wallR = this.baseR * 0.3;
    if (this !== dragTarget) {
      if (this.x < wallR     && this.vx < 0) { this.vx =  Math.abs(this.vx) * (0.9 + Math.random() * 0.2); this.vy += (Math.random() - 0.5) * this.speed * 0.3; }
      if (this.x > W - wallR && this.vx > 0) { this.vx = -Math.abs(this.vx) * (0.9 + Math.random() * 0.2); this.vy += (Math.random() - 0.5) * this.speed * 0.3; }
      if (this.y < wallR     && this.vy < 0) { this.vy =  Math.abs(this.vy) * (0.9 + Math.random() * 0.2); this.vx += (Math.random() - 0.5) * this.speed * 0.3; }
      if (this.y > H - wallR && this.vy > 0) { this.vy = -Math.abs(this.vy) * (0.9 + Math.random() * 0.2); this.vx += (Math.random() - 0.5) * this.speed * 0.3; }

      const spd = Math.hypot(this.vx, this.vy);
      if (spd > 0) { this.vx = (this.vx / spd) * this.speed; this.vy = (this.vy / spd) * this.speed; }

      this.x = Math.max(wallR, Math.min(W - wallR, this.x));
      this.y = Math.max(wallR, Math.min(H - wallR, this.y));
    }
  }

  buildPoints(t) {
    const rx   = this.baseR * Math.sqrt(this.imgAspect);
    const ry   = this.baseR / Math.sqrt(this.imgAspect);
    const ease = morphEase(this.morphT);
    const tPts = this.morphT > 0 ? this._computeTargetPts() : null;

    for (let i = 0; i < P; i++) {
      const angle = (i / P) * Math.PI * 2 + sineNoise(this.aPhases[i], t * 0.12);
      const nr    = 1 + sineNoise(this.rPhases[i], t * 0.18);
      let px = this.x + Math.cos(angle) * rx * nr;
      let py = this.y + Math.sin(angle) * ry * nr;

      if (tPts) {
        px = px + (tPts[i][0] - px) * ease;
        py = py + (tPts[i][1] - py) * ease;

        // Subtle perpendicular wiggle on mid-edge points when nearly open
        if (ease > 0.8 && (i % 4 === 1 || i % 4 === 2)) {
          const blend = (ease - 0.8) / 0.2;
          const nAmt  = sineNoise(this.rPhases[i], t * 0.05) * this.baseR * 0.06 * blend;
          if (Math.floor(i / 4) % 2 === 0) px += nAmt; // right/left sides: x wiggle
          else                              py += nAmt; // top/bottom sides: y wiggle
        }
      }

      this._pts[i][0] = Math.max(MARGIN, Math.min(W - MARGIN, px));
      this._pts[i][1] = Math.max(MARGIN, Math.min(H - MARGIN, py));
    }
  }

  // 16 target rectangle points, clockwise from right, matching blob winding order.
  // Side order: right → bottom → left → top; 4 points per side at 20/40/60/80% of each side.
  _computeTargetPts() {
    const hw = this.baseR * TEXTURE_SCALE * Math.sqrt(this.imgAspect) / 2 * MORPH_INSET;
    const hh = this.baseR * TEXTURE_SCALE / Math.sqrt(this.imgAspect) / 2 * MORPH_INSET;
    const cx = this.x, cy = this.y;
    const C = MORPH_CORNER, M = MORPH_MID;
    return [
      [cx + hw, cy - hh * C], [cx + hw, cy - hh * M], // right side, top half
      [cx + hw, cy + hh * M], [cx + hw, cy + hh * C], // right side, bottom half
      [cx + hw * C, cy + hh], [cx + hw * M, cy + hh], // bottom, right half
      [cx - hw * M, cy + hh], [cx - hw * C, cy + hh], // bottom, left half
      [cx - hw, cy + hh * C], [cx - hw, cy + hh * M], // left side, bottom half
      [cx - hw, cy - hh * M], [cx - hw, cy - hh * C], // left side, top half
      [cx - hw * C, cy - hh], [cx - hw * M, cy - hh], // top, left half
      [cx + hw * M, cy - hh], [cx + hw * C, cy - hh], // top, right half
    ];
  }

  // Trace the blob bezier outline onto c. Caller must call beginPath() first
  // (Path2D lacks beginPath, so keeping it separate lets buildPath2D reuse this).
  _trace(c) {
    for (let i = 0; i < P; i++) {
      const p0 = this._pts[(i - 1 + P) % P], p1 = this._pts[i];
      const p2 = this._pts[(i + 1) % P],     p3 = this._pts[(i + 2) % P];
      if (i === 0) c.moveTo(p1[0], p1[1]);
      c.bezierCurveTo(
        p1[0] + (p2[0] - p0[0]) / TENSION, p1[1] + (p2[1] - p0[1]) / TENSION,
        p2[0] - (p3[0] - p1[0]) / TENSION, p2[1] - (p3[1] - p1[1]) / TENSION,
        p2[0], p2[1],
      );
    }
    c.closePath();
  }

  // Build a Path2D on demand — only called on tap, not per frame
  buildPath2D() {
    const path = new Path2D();
    this._trace(path);
    return path;
  }

  draw(isSelected) {
    if (!this.ready) return;

    const alpha = Math.min(1, (performance.now() - this.fadeStart) / FADE_DURATION);
    const drawW = this.baseR * TEXTURE_SCALE * Math.sqrt(this.imgAspect);
    const drawH = this.baseR * TEXTURE_SCALE / Math.sqrt(this.imgAspect);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    this._trace(ctx);
    ctx.clip();
    ctx.drawImage(this.texture, this.x - drawW / 2, this.y - drawH / 2, drawW, drawH);

    ctx.restore();

    if (isSelected) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      this._trace(ctx);
      ctx.shadowColor = 'rgba(255, 255, 255, 0.85)';
      ctx.shadowBlur  = 28;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth   = 3;
      ctx.stroke();
      ctx.restore();
    }
  }

}

// Cap at 2× to keep render cost reasonable on 3× phones
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width        = Math.round(W * DPR);
  canvas.height       = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); // absolute set — never accumulates
}

resize();

let _resizeTimer = null;

window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    resize();

    if (selectedAmoeba) deselect();
    tapTarget = null; dragTarget = null; dragHistory = [];

    for (const a of amoebas) a.baseR = computeBaseR(projects[a.index].imgSize);

    const placed = [];
    for (const a of amoebas) {
      if (!a.ready) continue;
      placeBlob(a, placed);
      placed.push(a);
    }
  }, 150);
});

let amoebas = [];

let selectedAmoeba = null;

const panel = document.getElementById('info-panel');

panel.addEventListener('click', () => {
  if (!selectedAmoeba) return;
  const url = projects[selectedAmoeba.index].siteUrl;
  if (url) window.open(url, '_blank');
  else deselect();
});

function showPanel(a) {
  const proj = projects[a.index];
  panel.querySelector('h2').textContent = proj.title;
  const descEl = panel.querySelector('p');
  descEl.innerHTML = marked.parse(proj.description || '');
  descEl.querySelectorAll('a').forEach(a => a.setAttribute('target', '_blank'));
  const landscape = W > H;
  panel.style.transition = 'none';
  panel.className = landscape ? (a.x < W / 2 ? 'right' : 'left')
                               : (a.y < H / 2 ? 'bottom' : 'top');
  panel.offsetHeight;            // force reflow — commits off-screen position
  panel.style.transition = '';
  panel.classList.add('shown');
}

function hidePanel() {
  panel.classList.remove('shown');
  panel.addEventListener('transitionend', () => {
    if (!panel.classList.contains('shown')) panel.className = '';
  }, { once: true });
}

function select(a) {
  selectedAmoeba = a;
  a.frozen = true;
  a.morphStartX = a.x;
  a.morphStartY = a.y;

  const hw = a.baseR * TEXTURE_SCALE * Math.sqrt(a.imgAspect) / 2 * MORPH_INSET;
  const hh = a.baseR * TEXTURE_SCALE / Math.sqrt(a.imgAspect) / 2 * MORPH_INSET;
  const landscape  = W > H;
  const panelW = Math.min(280, Math.round(W * 0.26));
  const panelH = 150; // portrait panel height estimate for nudge

  let tx = Math.max(hw + MARGIN, Math.min(W - hw - MARGIN, a.x));
  let ty = Math.max(hh + MARGIN, Math.min(H - hh - MARGIN, a.y));

  if (landscape) {
    if (a.x < W / 2) tx = Math.min(W - panelW - hw - MARGIN, tx); // panel on right
    else             tx = Math.max(panelW + hw + MARGIN, tx);       // panel on left
  } else {
    if (a.y < H / 2) ty = Math.min(H - panelH - hh - MARGIN, ty); // panel at bottom
    else             ty = Math.max(panelH + hh + MARGIN, ty);       // panel at top
  }

  a.morphTargetX = tx;
  a.morphTargetY = ty;
  a.morphState = 'opening';
  showPanel(a);
}

function deselect() {
  if (!selectedAmoeba) return;
  selectedAmoeba.morphState = 'closing';
  selectedAmoeba = null;
  hidePanel();
}

let tapTarget   = null;
let dragTarget  = null;
let dragMx = 0, dragMy = 0;
let dragOffsetX = 0, dragOffsetY = 0;
let dragHistory = [];
let pointerDownX = 0, pointerDownY = 0;

canvas.addEventListener('pointerdown', e => {
  pointerDownX = e.clientX; pointerDownY = e.clientY;
  tapTarget = null; dragTarget = null;
  for (const a of amoebas) {
    if (!a.ready) continue;
    if (ctx.isPointInPath(a.buildPath2D(), e.clientX * DPR, e.clientY * DPR)) {
      if (!tapTarget || a.baseR < tapTarget.baseR) tapTarget = a;
    }
  }
  if (tapTarget) {
    dragTarget  = tapTarget;
    dragMx = e.clientX; dragMy = e.clientY;
    dragOffsetX = dragTarget.x - e.clientX;
    dragOffsetY = dragTarget.y - e.clientY;
    dragHistory = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
  }
  canvas.setPointerCapture(e.pointerId);
  e.preventDefault();
});

canvas.addEventListener('pointermove', e => {
  if (!dragTarget) return;
  dragMx = e.clientX; dragMy = e.clientY;
  dragHistory.push({ x: dragMx, y: dragMy, t: performance.now() });
  if (dragHistory.length > 15) dragHistory.shift();
});

canvas.addEventListener('pointercancel', () => { tapTarget = null; dragTarget = null; dragHistory = []; });

canvas.addEventListener('pointerup', e => {
  const moved = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
  if (moved < 12) {
    if (tapTarget && tapTarget === selectedAmoeba) {
      const url = projects[tapTarget.index].siteUrl;
      if (url) window.open(url, '_blank');
      else deselect();
    } else if (tapTarget) {
      deselect();
      select(tapTarget);
    } else {
      deselect();
    }
  } else if (dragTarget) {
    const now    = performance.now();
    const recent = dragHistory.filter(h => now - h.t < 150);
    if (recent.length >= 2) {
      const first = recent[0], last = recent[recent.length - 1];
      const dx = last.x - first.x, dy = last.y - first.y;
      const d  = Math.hypot(dx, dy);
      const throwDt = (last.t - first.t) / 1000;
      if (d > 2 && throwDt > 0) {
        const throwSpd = Math.min(d / throwDt, dragTarget._baseSpeed * 5);
        dragTarget.speed = throwSpd;
        dragTarget.vx = (dx / d) * throwSpd;
        dragTarget.vy = (dy / d) * throwSpd;
      }
    }
  }
  tapTarget = null; dragTarget = null; dragHistory = [];
});

let lastTs  = 0;
let simTime = 0;

function frame(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs   = ts;
  simTime += dt;

  ctx.clearRect(0, 0, W, H);

  for (const a of amoebas) a.update(dt);
  if (dragTarget) {
    dragTarget.x = dragMx + dragOffsetX;
    dragTarget.y = dragMy + dragOffsetY;
  }
  for (const a of amoebas) a.buildPoints(simTime);

  // Draw idle blobs smallest-first (reverse index) so larger blobs render on top
  for (let i = amoebas.length - 1; i >= 0; i--) {
    if (amoebas[i].morphState === 'idle') amoebas[i].draw(false);
  }
  for (const a of amoebas) {
    if (a.morphState !== 'idle') a.draw(a === selectedAmoeba);
  }

  requestAnimationFrame(frame);
}

fetch('projects.json')
  .then(r => r.json())
  .then(data => {
    projects        = data; // already sorted by imgSize descending in the JSON
    N               = projects.length;
    IMG_SIZE_SUM_SQ = projects.reduce((s, p) => s + p.imgSize ** 2, 0);
    amoebas         = projects.map((_, i) => new Amoeba(i));

    let _staggerOrigin = null;
    amoebas.forEach((a, step) => {
      const img = new Image();
      img.onload = () => {
        a.imgW = img.naturalWidth;
        a.imgH = img.naturalHeight;
        a.imgAspect = img.naturalWidth / img.naturalHeight;
        a.texture.width  = img.naturalWidth;
        a.texture.height = img.naturalHeight;
        a.texture.getContext('2d').drawImage(img, 0, 0);

        if (_staggerOrigin === null) _staggerOrigin = performance.now();
        const delay = Math.max(0, _staggerOrigin + step * REVEAL_INTERVAL - performance.now());
        setTimeout(() => {
          placeBlob(a, amoebas.filter(b => b.ready));
          a.ready     = true;
          a.fadeStart = performance.now();
        }, delay);
      };
      img.src = projects[step].imageUrl;
    });

    requestAnimationFrame(frame);
  });
</script>
</body>
</html>
