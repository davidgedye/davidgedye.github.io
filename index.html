<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David Gedye</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>G</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; position: fixed; top: 0; left: 0; touch-action: none; cursor: pointer; }
    #label {
      display: none;
      position: fixed;
      pointer-events: none;
      transform: translate(-50%, -50%);
      font-family: 'Playfair Display', serif;
      color: rgba(255, 255, 255, 0.95);
      background: rgba(0, 0, 0, 0.48);
      padding: 0.28em 0.75em;
      border-radius: 3px;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label"></div>
<script>
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const labelEl = document.getElementById('label');

const TENSION  = 8;
const MARGIN   = 10;
const P        = 10;
const N        = 10;
const COVERAGE = 0.5625;

let W, H;

function computeBaseR() {
  return Math.sqrt(COVERAGE * W * H / (N * Math.PI));
}

const projects = [
  { title: 'Alpha Beta Gamma',    url: '#' },
  { title: 'Delta Echo Foxtrot',  url: '#' },
  { title: 'Golf Hotel India',    url: '#' },
  { title: 'Juliet Kilo Lima',    url: '#' },
  { title: 'Mike November Oscar', url: '#' },
  { title: 'Papa Quebec Romeo',   url: '#' },
  { title: 'Sierra Tango Uniform',url: '#' },
  { title: 'Victor Whiskey Xray', url: '#' },
  { title: 'Yankee Zulu Alpha',   url: '#' },
  { title: 'Bravo Charlie Delta', url: '#' },
];

const TEX = 600;

const textureReady     = new Array(N).fill(false);
const textureFadeStart = new Array(N).fill(0);

const _img = new Image();
_img.onload = () => {
  textures.forEach((oc, i) => {
    const octx = oc.getContext('2d');
    // centre-crop the screenshot into the square texture
    const s = Math.min(_img.width, _img.height);
    const sx = (_img.width  - s) / 2;
    const sy = (_img.height - s) / 2;
    octx.drawImage(_img, sx, sy, s, s, 0, 0, TEX, TEX);
    textureReady[i]     = true;
    textureFadeStart[i] = performance.now();
  });
};
_img.src = 'screenshot.png';

const textures = projects.map(() => {
  const oc = document.createElement('canvas');
  oc.width = oc.height = TEX;
  return oc;
});

function sineNoise(phases, t) {
  let v = 0;
  for (const [freq, amp, phase] of phases) v += Math.sin(t * freq + phase) * amp;
  return v;
}

function makePhases(n, targetAmp) {
  const raw = Array.from({ length: n }, () => ({
    freq:  0.3 + Math.random() * 1.4,
    amp:   0.4 + Math.random() * 0.6,
    phase: Math.random() * Math.PI * 2,
  }));
  const total = raw.reduce((s, p) => s + p.amp, 0);
  return raw.map(p => [p.freq, p.amp / total * targetAmp, p.phase]);
}

class Amoeba {
  constructor(index) {
    this.index  = index;
    this.baseR  = computeBaseR();
    this.frozen = false;

    const pad = this.baseR;
    let x, y;
    for (let attempt = 0; attempt < 5; attempt++) {
      x = pad + Math.random() * (W - 2 * pad);
      y = pad + Math.random() * (H - 2 * pad);
      const tooClose = _placedPositions.some(p => Math.hypot(x - p.x, y - p.y) < this.baseR * 2);
      if (!tooClose || attempt === 4) break;
    }
    this.x = x;
    this.y = y;
    _placedPositions.push({ x, y });

    this._baseSpeed = Math.max(W, H) / (120 + Math.random() * 80);
    this.speed = this._baseSpeed;
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;

    this.age = Math.random() * 200;

    this.rPhases    = Array.from({ length: P }, () => makePhases(4, 0.55));
    this.aPhases    = Array.from({ length: P }, () => makePhases(2, 0.12));
    this.turnPhases = makePhases(3, 0.45);

    this._pts = Array.from({ length: P }, () => [0, 0]);
  }

  update(dt) {
    this.age += dt; // wiggle continues even when frozen

    if (this.frozen) return;

    if (this.speed > this._baseSpeed) {
      this.speed += (this._baseSpeed - this.speed) * Math.min(1, 1.5 * dt);
    }

    const heading = Math.atan2(this.vy, this.vx) + sineNoise(this.turnPhases, this.age * 0.08) * dt;
    this.vx = Math.cos(heading) * this.speed;
    this.vy = Math.sin(heading) * this.speed;

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    const r = this.baseR * 0.3;
    if (this.x < r         && this.vx < 0) { this.vx =  Math.abs(this.vx) * (0.9 + Math.random() * 0.2); this.vy += (Math.random() - 0.5) * this.speed * 0.3; }
    if (this.x > W - r     && this.vx > 0) { this.vx = -Math.abs(this.vx) * (0.9 + Math.random() * 0.2); this.vy += (Math.random() - 0.5) * this.speed * 0.3; }
    if (this.y < r         && this.vy < 0) { this.vy =  Math.abs(this.vy) * (0.9 + Math.random() * 0.2); this.vx += (Math.random() - 0.5) * this.speed * 0.3; }
    if (this.y > H - r     && this.vy > 0) { this.vy = -Math.abs(this.vy) * (0.9 + Math.random() * 0.2); this.vx += (Math.random() - 0.5) * this.speed * 0.3; }

    const spd = Math.hypot(this.vx, this.vy);
    if (spd > 0) { this.vx = (this.vx / spd) * this.speed; this.vy = (this.vy / spd) * this.speed; }

    this.x = Math.max(r, Math.min(W - r, this.x));
    this.y = Math.max(r, Math.min(H - r, this.y));
  }

  buildPoints(t) {
    for (let i = 0; i < P; i++) {
      const angle = (i / P) * Math.PI * 2 + sineNoise(this.aPhases[i], t * 0.12);
      const r     = this.baseR * (1 + sineNoise(this.rPhases[i], t * 0.18));
      this._pts[i][0] = Math.max(MARGIN, Math.min(W - MARGIN, this.x + Math.cos(angle) * r));
      this._pts[i][1] = Math.max(MARGIN, Math.min(H - MARGIN, this.y + Math.sin(angle) * r));
    }
  }

  // Trace the blob outline onto any 2D context (no allocation)
  _trace(c) {
    c.beginPath();
    for (let i = 0; i < P; i++) {
      const p0 = this._pts[(i - 1 + P) % P], p1 = this._pts[i];
      const p2 = this._pts[(i + 1) % P],     p3 = this._pts[(i + 2) % P];
      if (i === 0) c.moveTo(p1[0], p1[1]);
      c.bezierCurveTo(
        p1[0] + (p2[0] - p0[0]) / TENSION, p1[1] + (p2[1] - p0[1]) / TENSION,
        p2[0] - (p3[0] - p1[0]) / TENSION, p2[1] - (p3[1] - p1[1]) / TENSION,
        p2[0], p2[1],
      );
    }
    c.closePath();
  }

  // Build a Path2D on demand — only called on tap, not per frame
  buildPath2D() {
    const path = new Path2D();
    this._trace(path);
    return path;
  }

  draw(isSelected) {
    if (!textureReady[this.index]) return;

    const alpha = Math.min(1, (performance.now() - textureFadeStart[this.index]) / 1000);
    const s     = this.baseR * 3.2;

    ctx.save();
    ctx.globalAlpha = alpha;
    this._trace(ctx);
    ctx.clip();
    ctx.drawImage(textures[this.index], this.x - s / 2, this.y - s / 2, s, s);
    ctx.restore();

    if (isSelected) {
      ctx.save();
      ctx.globalAlpha = alpha;
      this._trace(ctx);
      ctx.shadowColor = 'rgba(255, 255, 255, 0.85)';
      ctx.shadowBlur  = 28;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth   = 3;
      ctx.stroke();
      ctx.restore();
    }
  }
}

// Cap at 2× to keep render cost reasonable on 3× phones
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width        = Math.round(W * DPR);
  canvas.height       = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); // absolute set — never accumulates
}

resize();

window.addEventListener('resize', () => {
  resize();
  const r = computeBaseR();
  for (const a of amoebas) a.baseR = r;
  if (selectedAmoeba) positionLabel(selectedAmoeba);
});

const _placedPositions = [];
const amoebas = Array.from({ length: N }, (_, i) => new Amoeba(i));

let selectedAmoeba = null;

function positionLabel(a) {
  labelEl.style.left     = a.x + 'px';
  labelEl.style.top      = a.y + 'px';
  labelEl.style.fontSize = Math.round(a.baseR * 0.11) + 'px';
}

function select(a) {
  selectedAmoeba = a;
  a.frozen = true;
  labelEl.textContent = projects[a.index].title;
  positionLabel(a);
  labelEl.style.display = 'block';
}

function deselect() {
  if (!selectedAmoeba) return;
  selectedAmoeba.frozen = false;
  selectedAmoeba.speed  = selectedAmoeba._baseSpeed;
  const angle = Math.random() * Math.PI * 2;
  selectedAmoeba.vx = Math.cos(angle) * selectedAmoeba._baseSpeed;
  selectedAmoeba.vy = Math.sin(angle) * selectedAmoeba._baseSpeed;
  selectedAmoeba    = null;
  labelEl.style.display = 'none';
}

let tapTarget = null;
let tapDownX  = 0, tapDownY = 0;

canvas.addEventListener('pointerdown', e => {
  tapDownX = e.clientX; tapDownY = e.clientY;
  tapTarget = null;
  for (const a of amoebas) {
    if (!textureReady[a.index]) continue;
    if (ctx.isPointInPath(a.buildPath2D(), e.clientX * DPR, e.clientY * DPR)) {
      if (!tapTarget || a.baseR < tapTarget.baseR) tapTarget = a;
    }
  }
  canvas.setPointerCapture(e.pointerId);
  e.preventDefault();
});

canvas.addEventListener('pointercancel', () => { tapTarget = null; });

canvas.addEventListener('pointerup', e => {
  const moved = Math.hypot(e.clientX - tapDownX, e.clientY - tapDownY);
  if (moved < 12) {
    if (tapTarget && tapTarget !== selectedAmoeba) {
      deselect();
      select(tapTarget);
    } else {
      deselect();
    }
  }
  tapTarget = null;
});

let lastTs  = 0;
let simTime = 0;

function frame(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs   = ts;
  simTime += dt;

  ctx.clearRect(0, 0, W, H);

  for (const a of amoebas) a.update(dt);
  for (const a of amoebas) a.buildPoints(simTime);

  // Draw order: normal → selected (topmost, with glow)
  for (const a of amoebas) {
    if (a !== selectedAmoeba) a.draw(false);
  }
  if (selectedAmoeba) selectedAmoeba.draw(true);

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
