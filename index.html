<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David Gedye</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>G</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; position: fixed; top: 0; left: 0; touch-action: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const TENSION = 8;   // Catmull-Rom handle divisor
const MARGIN  = 10;  // px — skeleton points clamped to this inner boundary
const P       = 10;  // skeleton control points per amoeba
const N       = 10;  // number of amoebas
const COVERAGE = 0.45;

let W, H;
let mouseX = -9999, mouseY = -9999;

function computeBaseR() {
  return Math.sqrt(COVERAGE * W * H / (N * Math.PI));
}

// Stub project data — fill in real titles/URLs later
const projects = [
  { title: 'Alpha Beta Gamma', url: '#' },
  { title: 'Delta Echo Foxtrot', url: '#' },
  { title: 'Golf Hotel India', url: '#' },
  { title: 'Juliet Kilo Lima', url: '#' },
  { title: 'Mike November Oscar', url: '#' },
  { title: 'Papa Quebec Romeo', url: '#' },
  { title: 'Sierra Tango Uniform', url: '#' },
  { title: 'Victor Whiskey Xray', url: '#' },
  { title: 'Yankee Zulu Alpha', url: '#' },
  { title: 'Bravo Charlie Delta', url: '#' },
];

const TEX = 600; // offscreen canvas size
// Font size that will appear as ~10% of baseR on screen (TEX / (baseR*3.2) * baseR*0.10 = TEX*0.10/3.2)
const LABEL_PX = Math.round(TEX * 0.10 / 3.2);

const textures = projects.map((p, i) => {
  const oc = document.createElement('canvas');
  oc.width = oc.height = TEX;
  const octx = oc.getContext('2d');
  octx.fillStyle = `hsl(${i * 36}, 55%, 35%)`;
  octx.fillRect(0, 0, TEX, TEX);
  const img = new Image();
  img.onload = () => {
    octx.clearRect(0, 0, TEX, TEX);
    octx.drawImage(img, 0, 0, TEX, TEX);
    octx.font = `${LABEL_PX}px system-ui, sans-serif`;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillStyle = 'rgba(0,0,0,0.55)';
    octx.fillText(p.title, TEX/2 + 1, TEX/2 + 1);
    octx.fillStyle = 'rgba(255,255,255,0.95)';
    octx.fillText(p.title, TEX/2, TEX/2);
  };
  img.src = `https://picsum.photos/seed/${(i + 1) * 11}/600/600`;
  return oc;
});

function sineNoise(phases, t) {
  let v = 0;
  for (const [freq, amp, phase] of phases) v += Math.sin(t * freq + phase) * amp;
  return v;
}

function makePhases(n, targetAmp) {
  const raw = Array.from({ length: n }, () => ({
    freq:  0.3 + Math.random() * 1.4,
    amp:   0.4 + Math.random() * 0.6,
    phase: Math.random() * Math.PI * 2,
  }));
  const total = raw.reduce((s, p) => s + p.amp, 0);
  return raw.map(p => [p.freq, p.amp / total * targetAmp, p.phase]);
}

class Amoeba {
  constructor(index) {
    this.index = index;
    this.baseR = computeBaseR();

    this.x = this.baseR + Math.random() * (W - 2 * this.baseR);
    this.y = this.baseR + Math.random() * (H - 2 * this.baseR);

    this._baseSpeed = Math.max(W, H) / (120 + Math.random() * 80);
    this.speed = this._baseSpeed;
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;

    this.age = Math.random() * 200;

    this.rPhases    = Array.from({ length: P }, () => makePhases(4, 0.55));
    this.aPhases    = Array.from({ length: P }, () => makePhases(2, 0.12));
    this.turnPhases = makePhases(3, 0.45);

    this._pts  = Array.from({ length: P }, () => [0, 0]);
    this._path = null;
  }

  update(dt) {
    this.age += dt;

    if (this.speed > this._baseSpeed) {
      this.speed += (this._baseSpeed - this.speed) * Math.min(1, 1.5 * dt);
    }

    const heading = Math.atan2(this.vy, this.vx) + sineNoise(this.turnPhases, this.age * 0.08) * dt;
    this.vx = Math.cos(heading) * this.speed;
    this.vy = Math.sin(heading) * this.speed;

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    if (this !== dragTarget) {
      const r = this.baseR * 0.3;
      if (this.x < r         && this.vx < 0) { this.vx =  Math.abs(this.vx) * (0.9 + Math.random() * 0.2); this.vy += (Math.random() - 0.5) * this.speed * 0.3; }
      if (this.x > W - r     && this.vx > 0) { this.vx = -Math.abs(this.vx) * (0.9 + Math.random() * 0.2); this.vy += (Math.random() - 0.5) * this.speed * 0.3; }
      if (this.y < r         && this.vy < 0) { this.vy =  Math.abs(this.vy) * (0.9 + Math.random() * 0.2); this.vx += (Math.random() - 0.5) * this.speed * 0.3; }
      if (this.y > H - r     && this.vy > 0) { this.vy = -Math.abs(this.vy) * (0.9 + Math.random() * 0.2); this.vx += (Math.random() - 0.5) * this.speed * 0.3; }

      const spd = Math.hypot(this.vx, this.vy);
      if (spd > 0) { this.vx = (this.vx / spd) * this.speed; this.vy = (this.vy / spd) * this.speed; }

      this.x = Math.max(r, Math.min(W - r, this.x));
      this.y = Math.max(r, Math.min(H - r, this.y));
    }
  }

  buildPoints(t) {
    for (let i = 0; i < P; i++) {
      const angle = (i / P) * Math.PI * 2 + sineNoise(this.aPhases[i], t * 0.12);
      const r     = this.baseR * (1 + sineNoise(this.rPhases[i], t * 0.18));
      this._pts[i][0] = Math.max(MARGIN, Math.min(W - MARGIN, this.x + Math.cos(angle) * r));
      this._pts[i][1] = Math.max(MARGIN, Math.min(H - MARGIN, this.y + Math.sin(angle) * r));
    }

    const path = new Path2D();
    for (let i = 0; i < P; i++) {
      const p0 = this._pts[(i - 1 + P) % P], p1 = this._pts[i];
      const p2 = this._pts[(i + 1) % P],     p3 = this._pts[(i + 2) % P];
      if (i === 0) path.moveTo(p1[0], p1[1]);
      path.bezierCurveTo(
        p1[0] + (p2[0] - p0[0]) / TENSION, p1[1] + (p2[1] - p0[1]) / TENSION,
        p2[0] - (p3[0] - p1[0]) / TENSION, p2[1] - (p3[1] - p1[1]) / TENSION,
        p2[0], p2[1],
      );
    }
    path.closePath();
    this._path = path;
  }

  draw(isHovered) {
    ctx.save();
    ctx.clip(this._path);
    const s = this.baseR * 3.2;
    ctx.drawImage(textures[this.index], this.x - s / 2, this.y - s / 2, s, s);
    ctx.restore();

    // Outline / hover glow
    if (isHovered) {
      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.85)';
      ctx.shadowBlur  = 28;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth   = 3;
      ctx.stroke(this._path);
      ctx.restore();
    } else {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth   = 1.5;
      ctx.stroke(this._path);
    }
  }
}

W = canvas.width  = window.innerWidth;
H = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const r = computeBaseR();
  for (const a of amoebas) a.baseR = r;
});

const amoebas = Array.from({ length: N }, (_, i) => new Amoeba(i));

let dragTarget  = null;
let dragMx = 0, dragMy = 0;
let dragOffsetX = 0, dragOffsetY = 0;
let dragHistory = [];
let pointerDownX = 0, pointerDownY = 0;

canvas.addEventListener('mousemove',  e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999; });

canvas.addEventListener('pointerdown', e => {
  const mx = e.clientX, my = e.clientY;
  pointerDownX = mx; pointerDownY = my;
  let best = null;
  for (const a of amoebas) {
    if (ctx.isPointInPath(a._path, mx, my)) {
      if (!best || a.baseR < best.baseR) best = a;
    }
  }
  if (best) {
    dragTarget  = best;
    dragMx = mx; dragMy = my;
    dragOffsetX = best.x - mx;
    dragOffsetY = best.y - my;
    dragHistory = [{ x: mx, y: my, t: performance.now() }];
    canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  }
});

canvas.addEventListener('pointermove', e => {
  if (!dragTarget) return;
  dragMx = e.clientX; dragMy = e.clientY;
  dragHistory.push({ x: dragMx, y: dragMy, t: performance.now() });
  if (dragHistory.length > 15) dragHistory.shift();
});

canvas.addEventListener('pointerup', e => {
  if (!dragTarget) return;

  const totalMoved = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);

  if (totalMoved < 8) {
    window.location.href = projects[dragTarget.index].url;
  } else {
    const now    = performance.now();
    const recent = dragHistory.filter(h => now - h.t < 150);
    if (recent.length >= 2) {
      const first = recent[0], last = recent[recent.length - 1];
      const dx = last.x - first.x, dy = last.y - first.y;
      const d  = Math.hypot(dx, dy);
      const throwDt = (last.t - first.t) / 1000;
      if (d > 2 && throwDt > 0) {
        const throwSpd = Math.min(d / throwDt, dragTarget._baseSpeed * 5);
        dragTarget.speed = throwSpd;
        dragTarget.vx = (dx / d) * throwSpd;
        dragTarget.vy = (dy / d) * throwSpd;
      }
    }
  }

  dragTarget  = null;
  dragHistory = [];
});

let lastTs  = 0;
let simTime = 0;

function frame(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs   = ts;
  simTime += dt;

  ctx.clearRect(0, 0, W, H);

  // Update positions first, then override drag, then build paths —
  // ensures image (drawn at this.x/y) and label (drawn at labelX/labelY) use identical coordinates
  for (const a of amoebas) a.update(dt);

  if (dragTarget) {
    dragTarget.x = dragMx + dragOffsetX;
    dragTarget.y = dragMy + dragOffsetY;
  }

  for (const a of amoebas) a.buildPoints(simTime);

  // Topmost amoeba under the cursor (last match in draw order wins)
  let hoveredAmoeba = null;
  for (const a of amoebas) {
    if (ctx.isPointInPath(a._path, mouseX, mouseY)) hoveredAmoeba = a;
  }
  canvas.style.cursor = hoveredAmoeba ? 'pointer' : 'default';

  // Draw hovered amoeba last so its glow renders on top
  for (const a of amoebas) {
    if (a !== hoveredAmoeba) a.draw(false);
  }
  if (hoveredAmoeba) hoveredAmoeba.draw(true);

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
